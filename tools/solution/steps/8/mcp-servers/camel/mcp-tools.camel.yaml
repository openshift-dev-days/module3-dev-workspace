- route:
    from:
      uri: ai-tool:amend-policy-document
      parameters:
        tags: all
        description: "Amends a policy document"
        parameter.id: string
        parameter.id.description: "Policy document identifier"
        parameter.id.required: true
        parameter.prompt: string
        parameter.prompt.description: "instructions to modify the invoice"
        parameter.prompt.required: true
      steps:
        - step:
            description: normal flow
            steps:
              - setVariable:
                  description: set file name
                  expression:
                    simple:
                      expression: policy_${header.id}.pdf
                  name: filename
              - to:
                  uri: direct
                  parameters:
                    name: get-policy-document-data
              - setBody:
                  simple:
                    expression: |-
                      ${header.prompt}

                      ${body}
              - setHeader:
                  description: set system prompt
                  disabled: false
                  language:
                    expression: resource:prompt.amend
                    language: simple
                  name: CamelOpenAISystemMessage
              - to:
                  uri: openai
                  parameters:
                    operation: chat-completion
              - setBody:
                  simple:
                    expression: ${body.trim()}
                  disabled: true
              - setVariable:
                  name: summary
                  xpath:
                    expression: /Amendment/Summary/text()
                    saxon: true
                  description: get summary
              - setBody:
                  xpath:
                    expression: /Amendment/Content/PolicyDocument
                    saxon: true
              - convertBodyTo:
                  type: String
              - log:
                  message: "summary: ${variable.summary}\\n${body}"
              - to:
                  uri: sql
                  parameters:
                    query: >-
                      INSERT INTO invoices (id, data) VALUES
                      (:#${header.id},:#${body})

                      ON CONFLICT (id)

                      DO UPDATE SET data = EXCLUDED.data
              - to:
                  uri: direct
                  parameters:
                    name: store-pdf-s3
                  disabled: false
              - setBody:
                  simple:
                    expression: >-
                      {
                        "status":"done",
                        "summary":  "${variable.summary}",
                        "actions":"1) Inform the user with 'The database records have been updated'. 2) Provide summary. 3) Ask if they'd like to see the new PDF policy document."
                      }
            disabled: false
- route:
    id: get-policy-document-data
    description: get-policy-document-data
    from:
      uri: direct
      parameters:
        name: get-policy-document-data
      steps:
        - convertHeaderTo:
            id: convertHeaderTo-9760
            name: id
            type: String
        - to:
            uri: sql
            parameters:
              query: select data from invoices where id = :#${header.id}
        - setBody:
            simple:
              expression: ${body[0]}
            disabled: true
        # - unmarshal:
        #     jacksonXml: {}
        #     disabled: true
        # - marshal:
        #     id: marshal-4078
        #     jacksonXml: {}
        #     disabled: true
        - log:
            message: ${body}



- route:
    from:
      uri: ai-tool:create-ticket
      parameters:
        tags: all
        description: "Creates a ticket in HelpDesk"
        parameter.subject: string
        parameter.content: string
        parameter.invoiceUrl: string
      steps:
        - setBody:
            simple: >-
              {
                "subject": "${header.subject}",
                "issue": "${header.content}<br><br>[📄 View Policy Document PDF](${header.invoiceUrl})"
              }
            description: set JSON call
        - to:
            uri: kamelet:helpdesk-create-ticket
            parameters:
              username: "{{helpdesk.username}}"
              password: "{{helpdesk.password}}"
              groupId: "{{helpdesk.group.id}}"
              typeId: "{{helpdesk.type.id.issue}}"
              priorityId: "{{helpdesk.priority.id.normal}}"
            description: Create helpdesk ticket
        - setBody:
            simple:
              expression: >-
                {
                  "status": "done",
                  "ticket-id": "${jq(.ticket.uid)}",
                  "actions": "1) Do not share the ticket with the customer. 2) Prompt the user with: 'Would you like to share this ticket with the customer?"
                }
        - log:
            message: Ticket created
            description: Log result
- route:
    id: store-pdf-s3
    from:
      uri: direct
      parameters:
        name: store-pdf-s3
      steps:
        - to:
            description: Template PDF
            uri: xslt-saxon
            parameters:
              resourceUri: template-pdf.xsl
        - process:
            description: generate PDF
            ref: InvoiceToPDF
        - to:
            description: store PDF
            uri: aws2-s3
            parameters:
              autoCreateBucket: true
              bucketNameOrArn: "{{s3.bucket}}"
              forcePathStyle: true
              keyName: policy_${header.id}.pdf
              overrideEndpoint: true
              region: us-east-1


- route:
    from:
      uri: ai-tool:share-ticket
      parameters:
        tags: all
        description: "Shares a ticket with customer"
        parameter.ticketId: string
      steps:
        - log:
            message: ${body}
        - setBody:
            simple:
              expression: >-
                {
                  "timesptamp":"${date:now}",
                  "source":"rocketchat",
                  "user":"ai",
                  "text":"<br><br><a href=\"{{helpdesk.url}}\">📄 Ticket <b>#${header.ticketId}</b></a> created.<br>(Click to open in HelpDesk)"
                }
        - to:
            uri: kafka
            parameters:
              topic: myroom
              brokers: my-cluster-kafka-bootstrap:9092
        - setBody:
            simple:
              expression: >-
                {
                  "status": "success",
                  "details": "ticket  #${header.ticketId} was sent to customer channel with link to HelpDesk"
                }
