apiVersion: camel.apache.org/v1alpha1
kind: Kamelet
metadata:
  name: rocketchat-sink
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "custom-0.0.1"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Custom Kamelets"
    camel.apache.org/kamelet.group: "RocketChat"
  labels:
    camel.apache.org/kamelet.type: "sink"
spec:
  definition:
    title: "RocketChat Sink"
    description: |-
      Send messages to RocketChat.
    required:
      - userid
      - token
    type: object
    properties:
      userid:
        title: User Id
        description: The RocketChat user id
        type: string
      token:
        title: Security Token
        description: The RocketChat security token
        type: string
  types:
    out:
      mediaType: application/json
  dependencies:
  - "camel:kamelet"
  template:
    from:
      uri: "kamelet:source"
      steps:
      - removeHeaders:
          pattern: "*"
      - setHeader:
          name: X-User-Id
          simple: "{{userid}}"
      - setHeader:
          name: X-Auth-Token
          simple: "{{token}}"
      - setHeader:
          name: Content-Type
          simple: application/json
      - to:
          uri: "http://rocketchat.rocketchat.svc:3000/api/v1/chat.postMessage"
