apiVersion: camel.apache.org/v1alpha1
kind: Kamelet
metadata:
  name: matrix-source
  annotations:
    camel.apache.org/kamelet.support.level: "Stable"
    camel.apache.org/catalog.version: "custom-0.0.1"
    camel.apache.org/kamelet.icon: "data:image/svg+xml;base64,"
    camel.apache.org/provider: "Custom Kamelets"
    camel.apache.org/kamelet.group: "Matrix"
  labels:
    camel.apache.org/kamelet.type: source
    camel.apache.org/kamelet.verified: "true"
spec:
  definition:
    title: Matrix Source
    description: Receives messages from Matrix.
    required:
      - room
      - token
    type: object
    properties:
      token:
        title: Security Token
        description: The Matrix security token
        type: string
      room:
        title: Chat Room
        description: The Matrix chat room
        type: string
  dependencies:
    - "camel:core"
    - "camel:timer"
    - "camel:jslt"
    - "camel:kamelet"
  template:
    from:
      uri: timer:trigger-matrix-streaming
      parameters:
        repeatCount: 1
      steps:
        - log:
            message: "Opening connection to Matrix..."
        - setHeader:
            name: Authorization
            expression:
              simple:
                expression: Bearer {{token}}
        - to:
            uri: http://synapse.matrix.svc:8008/_matrix/client/v3/sync?filter={"account_data":{"not_types":["*"]},"room":{"account_data":{"not_types":["*"]},"rooms":["{{room}}"],"timeline":{"limit":1,"types":["m.room.message"]},"state":{"not_types":["*"]} } }
        - log:
            message: "Matrix HTTP Streaming started"
        - loop:
            doWhile: true
            expression:
              simple:
                expression: true
            steps:
              - removeHeaders:
                  pattern: '*'
              - setProperty:
                  name: next_batch
                  expression:
                    jsonpath:
                      expression: $.next_batch
              - setHeader:
                  name: Authorization
                  expression:
                    simple:
                      expression: Bearer {{token}}
              - toD:
                  uri: >-
                    http://synapse.matrix.svc:8008/_matrix/client/v3/sync?timeout=30000&filter={"account_data":{"not_types":["*"]},"room":{"account_data":{"not_types":["*"]},"rooms":["{{room}}"],"timeline":{"limit":1,"types":["m.room.message"]},"state":{"not_types":["*"]} } }&since=${exchangeProperty.next_batch}&disableStreamCache=true
              - convertBodyTo:
                  type: String

              - choice:

                  when:
                    - expression:
                        jsonpath:
                          suppressExceptions: true
                          expression: $['rooms']
                      steps:
                        # keep data containing next batch
                        - setProperty:
                            name: backup-response
                            expression:
                              simple:
                                expression: ${body}

                        # The Matrix API has replaced the Matrix API.
                        # To minimise the impact in the workshop's code and docs
                        # we transform the Matrix data into simulated Matrix data.
                        # we apply a JSLT to transform the data
                        - setHeader:
                            name: CamelJsltString
                            expression:
                              constant:
                                expression: >-
                                  let event = [for (.rooms.join) .value.timeline.events[0]]

                                  {
                                    "fromUser": {
                                      "username": replace($event[0].sender,"@|:(.*)",""),
                                      "displayName": replace($event[0].sender,"@|:(.*)","")
                                    },
                                    "text": $event[0].content.body,
                                    "sent": format-time(replace($event[0].origin_server_ts, "[\\s\\S]{3}\\z", ""), "yyyy-MM-dd'T'HH:mm:ss.SSSX"),
                                  }
                        - to: "jslt:dummy?allowTemplateFromHeader=true"

                        # Invoke kamelet in separate thread to ensure loop's continuity.
                        # If Kamelet executes a filter or a 'stop' command, it may break the flow
                        - wireTap:
                            uri: kamelet:sink

                        # restore data with next batch for next loop
                        - setBody:
                            expression:
                              simple:
                                expression: ${exchangeProperty.backup-response}